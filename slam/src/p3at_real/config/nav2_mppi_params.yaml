# Nav2 with the MPPI controller for the real P3-AT (launch/nav.launch.py default).
# Same robot setup as nav2_params.yaml (frames, /scan costmaps, RTAB-Map /map, collision monitor,
# speed limits matching cmd_vel_mux); only the path follower differs (MPPI instead of RPP).
# Frames: map (RTAB-Map) -> odom (RKO-LIO) -> base_link. use_sim_time is false: real robot.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /rko_lio/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names: [nav2_compute_path_to_pose_action_bt_node, nav2_compute_path_through_poses_action_bt_node,
      nav2_smooth_path_action_bt_node, nav2_follow_path_action_bt_node, nav2_spin_action_bt_node, nav2_wait_action_bt_node,
      nav2_assisted_teleop_action_bt_node, nav2_back_up_action_bt_node, nav2_drive_on_heading_bt_node, nav2_clear_costmap_service_bt_node,
      nav2_is_stuck_condition_bt_node, nav2_goal_reached_condition_bt_node, nav2_goal_updated_condition_bt_node,
      nav2_globally_updated_goal_condition_bt_node, nav2_is_path_valid_condition_bt_node, nav2_initial_pose_received_condition_bt_node,
      nav2_reinitialize_global_localization_service_bt_node, nav2_rate_controller_bt_node, nav2_distance_controller_bt_node,
      nav2_speed_controller_bt_node, nav2_truncate_path_action_bt_node, nav2_truncate_path_local_action_bt_node,
      nav2_goal_updater_node_bt_node, nav2_recovery_node_bt_node, nav2_pipeline_sequence_bt_node, nav2_round_robin_node_bt_node,
      nav2_transform_available_condition_bt_node, nav2_time_expired_condition_bt_node, nav2_path_expiring_timer_condition,
      nav2_distance_traveled_condition_bt_node, nav2_single_trigger_bt_node, nav2_goal_updated_controller_bt_node,
      nav2_is_battery_low_condition_bt_node, nav2_navigate_through_poses_action_bt_node, nav2_navigate_to_pose_action_bt_node,
      nav2_remove_passed_goals_action_bt_node, nav2_planner_selector_bt_node, nav2_controller_selector_bt_node,
      nav2_goal_checker_selector_bt_node, nav2_controller_cancel_bt_node, nav2_path_longer_on_approach_bt_node,
      nav2_wait_cancel_bt_node, nav2_spin_cancel_bt_node, nav2_back_up_cancel_bt_node, nav2_assisted_teleop_cancel_bt_node,
      nav2_drive_on_heading_cancel_bt_node, nav2_is_battery_charging_condition_bt_node]
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters: {use_sim_time: false}
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters: {use_sim_time: false}
controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /rko_lio/odom
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker: {plugin: 'nav2_controller::SimpleProgressChecker', required_movement_radius: 0.5, movement_time_allowance: 10.0}
    general_goal_checker: {stateful: true, plugin: 'nav2_controller::SimpleGoalChecker', xy_goal_tolerance: 0.27,
      yaw_goal_tolerance: 0.25}
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: DiffDrive
      time_steps: 30
      model_dt: 0.1
      batch_size: 500
      vx_std: 0.15
      wz_std: 0.4
      vx_max: 0.25
      vx_min: 0.0
      wz_max: 0.6
      iteration_count: 1
      visualize: false
      critics: [ConstraintCritic, ObstaclesCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic,
        PathAngleCritic, PreferForwardCritic]
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true            # local map moves with the robot
      width: 4
      height: 4
      resolution: 0.05
      plugins: [obstacle_layer, inflation_layer]
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 3.0, inflation_radius: 0.55}
      always_send_full_costmap: true
      footprint: '[[0.24, 0.225], [0.24, -0.225], [-0.24, -0.225], [-0.24, 0.225]]'
      footprint_padding: 0.03
      transform_tolerance: 0.3
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan: {topic: /scan, data_type: LaserScan, marking: true, clearing: true, max_obstacle_height: 2.0, obstacle_max_range: 3.5,
          obstacle_min_range: 0.0, raytrace_max_range: 4.0, raytrace_min_range: 0.0}
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: false
      resolution: 0.05
      plugins: [static_layer, obstacle_layer, inflation_layer]
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 3.0, inflation_radius: 0.55}
      static_layer: {plugin: 'nav2_costmap_2d::StaticLayer', map_topic: /map, map_subscribe_transient_local: true}
      always_send_full_costmap: true
      track_unknown_space: true
      footprint: '[[0.24, 0.225], [0.24, -0.225], [-0.24, -0.225], [-0.24, 0.225]]'
      footprint_padding: 0.03
      transform_tolerance: 0.3
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan: {topic: /scan, data_type: LaserScan, marking: true, clearing: true, max_obstacle_height: 2.0, obstacle_max_range: 3.5,
          obstacle_min_range: 0.0, raytrace_max_range: 4.0, raytrace_min_range: 0.0}
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins: [GridBased]
    GridBased: {plugin: nav2_navfn_planner/NavfnPlanner, tolerance: 0.5, use_astar: false, allow_unknown: true}
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother: {plugin: 'nav2_smoother::SimpleSmoother', tolerance: 1.0e-10, max_its: 1000, do_refinement: true}
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, assisted_teleop, wait]
    spin: {plugin: nav2_behaviors/Spin}
    backup: {plugin: nav2_behaviors/BackUp}
    drive_on_heading: {plugin: nav2_behaviors/DriveOnHeading}
    wait: {plugin: nav2_behaviors/Wait}
    assisted_teleop: {plugin: nav2_behaviors/AssistedTeleop}
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.5
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint: {plugin: 'nav2_waypoint_follower::WaitAtWaypoint', enabled: true, waypoint_pause_duration: 200}
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.3, 0.0, 0.6]
    min_velocity: [-0.3, 0.0, -0.6]
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-0.8, 0.0, -2.0]
    odom_topic: /rko_lio/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# Last Nav2 stage: /cmd_vel_smoothed -> here -> /cmd_vel_nav_safe -> cmd_vel_mux. Acts on the raw
# /scan, independent of the costmaps and planner, so it also catches people stepping in front.
# Humble semantics: a zone triggers when MORE than max_points scan points are inside it.
#
# Blind spot: pointcloud_to_laserscan drops returns closer than 0.4 m to base_link (range_min in
# nav.launch.py), and the body reaches 0.24 m forward. So the zones only see from ~0.4 m out, and
# the stop zone has to reach well past that to be useful.
# Zones are front-only (x >= 0): the robot never reverses on a path (allow_reversing: false), and
# BackUp checks the local costmap itself. A rear zone would freeze the robot against walls.
collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_nav_safe"
    transform_tolerance: 0.3
    source_timeout: 1.0               # header-stamp age; /scan is ~3 Hz and 0.3-0.5 s old on arrival (cloud_scan_num 54)
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "PolygonSlow"]
    # Stop: something within ~0.3 m of the front bumper (body front at x = 0.24, half-width 0.225)
    PolygonStop:
      type: "polygon"
      points: [0.55, 0.32, 0.55, -0.32, 0.0, -0.32, 0.0, 0.32]
      action_type: "stop"
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True
    # Slow to 40 %: something within ~0.75 m ahead or close beside the front half
    PolygonSlow:
      type: "polygon"
      points: [1.0, 0.45, 1.0, -0.45, 0.0, -0.45, 0.0, 0.45]
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.4
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: True
