# KISS-ICP tuned for the indoor worlds (16-ring lidar, rooms < 30 m).
# The stock config uses max_range 100 -> 1 m map voxels, too coarse for offices.
kiss_icp_node:
  ros__parameters:
    data:
      deskew: True
      max_range: 30.0   # -> voxel_size 0.3 m (max_range / 100)
      min_range: 0.3
    mapping:
      max_points_per_voxel: 20
    adaptive_threshold:
      initial_threshold: 2.0
      min_motion_th: 0.1
